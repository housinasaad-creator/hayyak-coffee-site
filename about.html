<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>من نحن | حيّاك</title>
<meta name="description" content="About Hayyak: Arabic and Syrian coffee roasted in small batches and supplied wholesale.">
<meta name="theme-color" content="#0b0907">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="about">
<div id="hdr"></div>
<main>
  <section class="phero">
    <div class="pattern"></div>
    <div class="wrap">
      <div class="eyebrow" data-i18n="a.k"></div>
      <h1 class="h1" data-i18n="a.t"></h1>
      <p class="lead" data-i18n="a.p"></p>
    </div>
  </section>

  <section class="sec" style="padding-top:30px">
    <div class="wrap story">
      <h2 class="h2 reveal" data-i18n="a.s1.t"></h2>
      <div><p class="reveal d1" data-i18n="a.s1.p1"></p><p class="reveal d2" data-i18n="a.s1.p2"></p></div>
    </div>
  </section>

  <section class="sec" style="background:var(--sage)">
    <div class="wrap">
      <div class="eyebrow reveal" data-i18n="a.v.k"></div>
      <div class="vals">
        <article class="val reveal d1"><h3 data-i18n="a.v.1.t"></h3><p data-i18n="a.v.1.p"></p></article>
        <article class="val reveal d2"><h3 data-i18n="a.v.2.t"></h3><p data-i18n="a.v.2.p"></p></article>
        <article class="val reveal d3"><h3 data-i18n="a.v.3.t"></h3><p data-i18n="a.v.3.p"></p></article>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <div class="eyebrow reveal" data-i18n="a.pr.k"></div>
      <ol class="proc reveal d1">
        <li><span data-i18n="a.pr.1"></span></li><li><span data-i18n="a.pr.2"></span></li><li><span data-i18n="a.pr.3"></span></li><li><span data-i18n="a.pr.4"></span></li><li><span data-i18n="a.pr.5"></span></li>
      </ol>
    </div>
  </section>

  <section class="sec" style="background:linear-gradient(180deg,var(--bg),var(--sage))">
    <div class="wrap">
      <div class="eyebrow reveal" data-i18n="a.who.k"></div>
      <div class="who reveal d1"><div data-i18n="a.who.1"></div><div data-i18n="a.who.2"></div><div data-i18n="a.who.3"></div><div data-i18n="a.who.4"></div></div>
      <p class="reveal d2" style="margin-top:44px"><a class="btn gold" href="index.html#contact"><span data-i18n="btn.quote"></span></a>&nbsp;&nbsp;<a class="btn line" href="products.html"><span data-i18n="btn.products"></span></a></p>
    </div>
  </section>
</main>
<div id="ftr"></div>
<script type="module" src="js/layout.js"></script>
</body>
</html>
